<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1015" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Binder">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>My Binder — prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --ink:#16181D; --ink2:#3A3E49; --muted:#5B6070;
  --line:#E3E4E8; --line2:#D4D6DC; --accent:#C8291D; --accent-hover:#A9221A; --on-accent:#FFFFFF;
  --on-bg:#16181D; --on-ink:#FFFFFF; --good:#2D5A1B; --good-bg:#E4F1DC; --danger:#A3241A;
  --scrim:rgba(22,24,29,.45); --toast:#16181D; --toast-ink:#FFFFFF; --toast-link:#FFB4A8; --toast-muted:#B7BAC4;
  --outer:#E9E9E4;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131418; --surface:#1D1F25; --ink:#F1F2F4; --ink2:#D2D5DC; --muted:#A3A8B5;
    --line:#2C2F37; --line2:#3B3F4A; --on-bg:#F1F2F4; --on-ink:#16181D;
    --good:#A5D58F; --good-bg:#23331C; --danger:#FF8F82; --scrim:rgba(0,0,0,.6);
    --toast:#F1F2F4; --toast-ink:#16181D; --toast-link:#A3241A; --toast-muted:#5B6070; --outer:#0C0D10;
  }
}
:root[data-theme="dark"]{
  --bg:#131418; --surface:#1D1F25; --ink:#F1F2F4; --ink2:#D2D5DC; --muted:#A3A8B5;
  --line:#2C2F37; --line2:#3B3F4A; --on-bg:#F1F2F4; --on-ink:#16181D;
  --good:#A5D58F; --good-bg:#23331C; --danger:#FF8F82; --scrim:rgba(0,0,0,.6);
  --toast:#F1F2F4; --toast-ink:#16181D; --toast-link:#A3241A; --toast-muted:#5B6070; --outer:#0C0D10;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--outer)}
body{height:100%;margin:0;background:var(--outer);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){
  body{display:flex;align-items:center;justify-content:center;padding:20px}
  .app{width:430px;max-width:430px;flex-shrink:0;height:min(932px,100%);margin:0;border-radius:48px;border:11px solid #0E0F12;box-shadow:0 0 0 1px #3A3D45,0 30px 80px rgba(0,0,0,.28)}
  .app::after{content:"";position:absolute;bottom:7px;left:50%;width:120px;height:5px;margin-left:-60px;border-radius:3px;background:var(--ink);opacity:.35;pointer-events:none;z-index:40}
  nav.tabs{padding-bottom:14px;height:78px}
  .top{padding-top:30px}
}
#screen{flex:1;min-height:0;display:flex;flex-direction:column}
.enter{animation:enter .22s ease-out}
.enter-back{animation:enterBack .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes enterBack{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter,.enter-back,.sheet,.toast{animation:none!important}}
.top{padding:20px 20px 10px;display:flex;flex-direction:column;gap:12px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 28px}
h1{margin:0;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
h2{margin:0;font-size:15px;font-weight:700}
.sub{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.fab{width:48px;height:48px;border-radius:24px;border:none;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fab:hover{background:var(--accent-hover)}
.search{position:relative;flex:1}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);padding:0 14px 0 40px;font-size:16px}
.search.big input{height:50px;border:2px solid var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"],.chip.on{background:var(--on-bg);color:var(--on-ink);border-color:var(--on-bg)}
.pill{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line2);background:var(--surface);font-size:14px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--on-bg);color:var(--on-ink);border-color:var(--on-bg)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.btn{height:52px;border-radius:26px;border:none;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;width:100%}
.btn:hover{background:var(--accent-hover)}
.btn-ghost{height:44px;border:none;background:transparent;font-size:15px;font-weight:600;padding:0 10px}
.danger{color:var(--danger)}
.link{color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}
.tile{aspect-ratio:63/88;border-radius:10px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(22,24,29,.1);text-align:left}
.tile .t{font-size:10px;font-weight:700;letter-spacing:.04em}
.tile .n{font-family:var(--display);font-size:28px;font-weight:700;text-align:center}
.tile .v{font-size:11px;font-weight:600;line-height:1.2}
.qty{font-size:11px;font-weight:700;background:#16181D;color:#fff;border-radius:999px;padding:2px 7px}
.card-btn{border:none;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.card-btn .nm{font-size:13px;font-weight:600;line-height:1.25}
.card-btn .st{font-size:12px;color:var(--muted);margin-top:-4px}
.list{display:flex;flex-direction:column;gap:8px}
.lrow{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:12px;text-align:left}
.mini{width:46px;height:64px;flex-shrink:0;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:15px;border:1px solid rgba(22,24,29,.1)}
.lrow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lrow .nm{font-size:15px;font-weight:700}
.lrow .meta{font-size:12px;color:var(--muted)}
.lrow .meta2{font-size:12px;font-weight:600;color:var(--ink2)}
.big-qty{font-family:var(--display);font-size:20px;font-weight:700}
.empty{margin-top:48px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.empty .ttl{font-family:var(--display);font-size:20px;font-weight:700}
.empty p{margin:0;font-size:14px;color:var(--muted);max-width:270px;line-height:1.45}
nav.tabs{height:64px;flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.back{height:44px;padding:0 8px 0 2px;border:none;background:none;display:flex;align-items:center;gap:2px;font-size:15px;font-weight:600;margin-left:-6px}
.section{display:flex;flex-direction:column;gap:8px}
.slabel{font-size:13px;font-weight:700;color:var(--ink2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px}
.copy{width:100%;min-height:60px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.copy[aria-pressed="true"]{background:var(--on-bg);color:var(--on-ink);border-color:var(--on-bg)}
.copy .a{font-size:15px;font-weight:700}
.copy .b{font-size:12px;opacity:.8}
.dashed{height:44px;border-radius:12px;border:1px dashed var(--muted);background:transparent;font-size:14px;font-weight:600}
.field{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);padding:10px 14px;font-size:16px;resize:none}
.stepper{display:flex;align-items:center;gap:14px}
.step{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--surface);font-size:22px;font-weight:700;line-height:1}
.step.dark{background:var(--on-bg);color:var(--on-ink);border-color:var(--on-bg)}
.stepval{min-width:24px;text-align:center;font-family:var(--display);font-size:24px;font-weight:700}
.switch{width:52px;height:32px;border-radius:16px;border:none;padding:3px;display:flex;background:#9A9EA9;flex-shrink:0}
.switch span{width:26px;height:26px;border-radius:13px;background:#fff;display:block;transition:transform .15s}
.switch[aria-checked="true"]{background:#2D7A1F}
.switch[aria-checked="true"] span{transform:translateX(20px)}
.saved{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--good);margin-left:auto}
.done{height:44px;padding:0 6px 0 12px;border:none;background:none;color:var(--accent);font-size:16px;font-weight:700}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-weight:600}
.own{align-self:flex-start;background:var(--on-bg);color:var(--on-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;align-items:center;gap:12px}
.result .mini{width:52px;height:72px;font-size:16px}
.addbtn{height:44px;min-width:72px;padding:0 16px;border-radius:22px;border:none;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:700}
.counter{display:flex;align-items:center;background:var(--good-bg);border-radius:22px;padding:0 2px}
.counter button{width:40px;height:44px;border:none;background:none;color:var(--good);font-size:20px;font-weight:700}
.counter span{min-width:24px;text-align:center;font-size:15px;font-weight:700;color:var(--good)}
.inbinder{font-size:12px;font-weight:700;color:var(--good)}
.setcard{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;min-width:8px;background:var(--accent);border-radius:4px}
.backup{margin-top:18px;background:var(--on-bg);color:var(--on-ink);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.backup p{margin:0;font-size:14px;line-height:1.45;opacity:.85}
.backup .b1{flex:1;height:48px;border-radius:24px;border:none;background:var(--on-ink);color:var(--on-bg);font-weight:700;font-size:15px}
.backup .b2{flex:1;height:48px;border-radius:24px;border:1px solid currentColor;background:transparent;font-weight:600;font-size:15px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:3px}
.seg button{height:40px;border:none;border-radius:9px;background:transparent;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--on-bg);color:var(--on-ink)}
.slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.slot{aspect-ratio:63/88;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:700;padding:0}
.slot.have{border:1px solid rgba(22,24,29,.12)}
.slot.miss{border:1.5px dashed var(--line2);background:transparent;color:var(--muted);font-weight:600}
button.slot.miss{border-color:var(--muted)}
.slot small{font-size:10px}
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;border:none;padding:0;background:var(--scrim)}
.sheet{position:relative;max-height:88%;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:sheet .25s ease-out}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:6px 20px 16px;display:flex;flex-direction:column;gap:20px}
.sheet-foot{padding:12px 20px 20px;background:var(--surface);border-top:1px solid var(--line)}
.wrap{display:flex;gap:8px;flex-wrap:wrap}
.zoom{position:absolute;inset:0;z-index:30;background:rgba(10,11,14,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px}
.zoom .tile{width:min(300px,78vw);border-radius:18px;padding:18px}
.zoom .tile .n{font-size:88px}
.zoom button{height:48px;padding:0 26px;border-radius:24px;border:1px solid #fff;background:transparent;color:#fff;font-weight:600}
.toast{position:absolute;left:12px;right:12px;bottom:76px;z-index:25;background:var(--toast);color:var(--toast-ink);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:2px;animation:sheet .2s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast .tx{flex:1;min-width:0;font-size:14px;line-height:1.3}
.toast .tx small{display:block;font-size:12px;color:var(--toast-muted)}
.toast button{height:44px;padding:0 10px;border:none;background:none;font-size:14px;font-weight:700;color:var(--toast-ink)}
.toast button.undo{color:var(--toast-link)}
.ph{position:relative;padding:0;overflow:hidden;background:#2A2C33}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .qty{position:absolute;top:6px;right:6px}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap}
.photo-btn{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line2);background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.photo-btn.primary{background:var(--on-bg);color:var(--on-ink);border-color:var(--on-bg)}
.photo-btn input{position:absolute;width:1px;height:1px;opacity:0}
.vb{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9px;font-size:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.vb.f{background:linear-gradient(120deg,#F6D365,#FDA085 40%,#A1C4FD 75%,#C2E9FB);color:#1A1B20}
.vb.n{background:var(--line);color:var(--ink2)}
.vb.pb{background:#FFFFFF;color:#B3261E;box-shadow:inset 0 0 0 1.5px #B3261E}
.vb.mb{background:#5B2A86;color:#FFFFFF}
.vb.r{background:#16181D;color:#F6D365;box-shadow:inset 0 0 0 1px #F6D365}
.tile.foil,.mini.foil{background-image:linear-gradient(125deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.6) 45%,rgba(255,255,255,0) 60%)}
.tile.rfoil,.mini.rfoil{box-shadow:inset 0 0 0 3px rgba(222,178,60,.9)}
.foilinfo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.foilinfo summary{min-height:44px;display:flex;align-items:center;font-size:14px;font-weight:700;cursor:pointer;list-style:none}
.foilinfo summary::-webkit-details-marker{display:none}
.foilinfo summary::after{content:"+";margin-left:auto;font-size:18px;color:var(--muted)}
.foilinfo[open] summary::after{content:"−"}
.foilinfo p{margin:0 0 12px;font-size:13px;line-height:1.5;color:var(--ink2)}
.ckrow{width:100%;display:flex;align-items:center;gap:12px;padding:6px 12px 6px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:64px}
.ckmiss{background:transparent!important;border:1.5px dashed var(--line2)!important;color:var(--muted)}
.ckmiss.sec{border-color:#B08A2E!important}
.ckown{font-size:12px;font-weight:700;color:var(--good);white-space:nowrap}
.ckmissing{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.sgroup{display:flex;flex-direction:column;gap:12px}
.sghead{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;position:sticky;top:0;z-index:2}
.sgcode{width:40px;height:40px;flex-shrink:0;border-radius:10px;background:var(--on-bg);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:12px}
.sgname{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:15px;font-weight:700}
.sgchev{display:flex;transition:transform .15s;transform:rotate(-90deg);color:var(--muted)}
.sgchev.open{transform:none}
.tip{font-size:12px;color:var(--muted);line-height:1.45}
.tries{display:flex;gap:8px;flex-wrap:wrap}

/* ---- visual polish ---- */
:root{--bg:#F3F4F7;--surface:#FFFFFF;--line:#E4E6EB;--shadow:0 1px 2px rgba(20,22,30,.06),0 8px 24px -12px rgba(20,22,30,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1015;--surface:#1A1C23;--line:#272A33;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#0F1015;--surface:#1A1C23;--line:#272A33;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7)}
h1{font-size:32px;letter-spacing:-.025em}
.top{gap:14px}
.face{position:relative;display:block;width:100%;aspect-ratio:63/88;border-radius:7px;overflow:hidden;flex-shrink:0;padding:0;border:none;background:#DDE0E6;box-shadow:0 1px 1px rgba(0,0,0,.12),0 6px 16px -8px rgba(10,12,20,.45);transition:transform .15s ease}
.face.mini{width:46px;border-radius:5px;box-shadow:0 1px 1px rgba(0,0,0,.12),0 3px 8px -4px rgba(10,12,20,.4)}
.face svg,.face img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.face .qty{position:absolute;bottom:5px;right:5px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.face .vbx{position:absolute;left:5px;bottom:5px;display:flex}
.face.foilfx::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.55) 42%,rgba(210,235,255,.35) 48%,rgba(255,220,250,.3) 53%,transparent 66%);background-size:260% 100%;mix-blend-mode:soft-light;animation:sheen 5s ease-in-out infinite}

/* ---------- save & load ---------- */
var LAST_KEY='pkbinder-lastbackup';
function lastBackupText(){var t=null;try{t=localStorage.getItem(LAST_KEY);}catch(e){}
  if(!t)return 'No backup saved yet';var d=new Date(+t);return 'Last saved '+d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
function backupData(){return {app:'my-binder',version:1,savedAt:new Date().toISOString(),cards:inv,decks:decks,photos:photos,folded:folded};}
function summarize(b){
  var ids=Object.keys(b.cards||{}).filter(function(id){return CARD[id]&&CARD[id].kind!=='Energy';});
  var copies=ids.reduce(function(n,id){return n+(b.cards[id]||[]).reduce(function(m,c){return m+(+c.qty||0);},0);},0);
  return plural(ids.length,'card','cards')+' ('+plural(copies,'copy','copies')+'), '+plural((b.decks||[]).length,'deck','decks')+', '+plural(Object.keys(b.photos||{}).length,'photo','photos');
}
function validBackup(b){
  if(!b||typeof b!=='object'||b.app!=='my-binder'||typeof b.cards!=='object'||Array.isArray(b.cards)||!Array.isArray(b.decks))return false;
  return Object.keys(b.cards).every(function(id){return Array.isArray(b.cards[id])&&b.cards[id].every(function(c){return c&&typeof c.variant==='string'&&typeof c.qty==='number';});})&&
    b.decks.every(function(d){return d&&typeof d.name==='string'&&d.cards&&typeof d.cards==='object';});
}
async function saveBackup(){
  var json=JSON.stringify(backupData(),null,1);
  var name='my-binder-backup-'+new Date().toISOString().slice(0,10)+'.json';
  var dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){dl=null;}
  if(!dl){S.listText=json;S.listTitle='Backup';renderLayer();return;}
  try{await dl.save({filename:name,data:json});
    try{localStorage.setItem(LAST_KEY,String(Date.now()));}catch(e){}
    showToast({text:'Backup saved',sub:name});if(route().name==='sets')render();
  }catch(err){
    var code=err&&err.code;
    if(code==='declined')showToast({text:'Backup not saved'});
    else if(code==='rate_limited')showToast({text:'A save is already waiting for you',sub:'Finish or close it, then try again'});
    else{S.listText=json;S.listTitle='Backup';renderLayer();}
  }
}
function confirmLoadHTML(){
  var b=S.pendingLoad;var when=b.savedAt?new Date(b.savedAt):null;
  return '<div class="overlay"><button class="scrim" data-act="cancelload" aria-label="Cancel"></button><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ld-t"><div class="grab"></div>'+
    '<div class="sheet-body" style="padding-top:12px"><h2 id="ld-t" style="font-family:var(--display);font-size:22px">Load this backup?</h2>'+
    '<div class="panel" style="padding:12px 14px;gap:4px"><span style="font-weight:700">'+esc(summarize(b))+'</span><span class="sub" style="font-size:13px">'+(when&&!isNaN(when)?'Saved '+esc(when.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})):'Save date unknown')+'</span></div>'+
    '<p class="sub" style="margin:0;font-size:14px;line-height:1.45">This replaces everything currently in the app: '+esc(summarize(backupData()))+'. You can undo straight after.</p></div>'+
    '<div class="sheet-foot" style="display:flex;flex-direction:column;gap:6px"><button class="btn" data-act="doload">Replace with backup</button><button class="btn-ghost" data-act="cancelload" style="align-self:center">Cancel</button></div></div></div>';
}

}
function animateOut(nodes,cb){
  nodes=nodes.filter(Boolean);if(!nodes.length||REDUCE){cb();return;}
  nodes.forEach(function(n){n.classList.add('closing');});setTimeout(cb,170);
}
function markOpening(nodes){if(REDUCE)return;nodes.filter(Boolean).forEach(function(n){n.classList.add('opening');setTimeout(function(){n.classList.remove('opening');},400);});}
function pop(sel){if(REDUCE)return;var n=document.querySelector(sel);if(n){n.classList.remove('pop');void n.offsetWidth;n.classList.add('pop');}}
function showToast(t){S.toast=t;renderToast();clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,6000);}
function hideToast(){S.toast=null;var el=document.querySelector('#toast-slot .toast');if(el&&!REDUCE){el.classList.add('out');setTimeout(function(){if(!S.toast)renderToast();},180);}else renderToast();}
function renderToast(){
  var el=document.getElementById('toast-slot');var t=S.toast;
  if(!t){el.innerHTML='';return;}
  el.innerHTML='<div class="toast" role="status"><span class="tx">'+esc(t.text)+(t.sub?'<small>'+esc(t.sub)+'</small>':'')+'</span>'+
    (t.edit?'<button data-act="toastedit">Edit</button>':'')+(t.undo?'<button class="undo" data-act="undo">Undo</button>':'')+'</div>';
}
function renderLayer(){
  var el=document.getElementById('layer');var h='';
  if(S.sheet&&route().name==='binder')h+=sheetHTML();
  if(S.deckSheet)h+=deckSheetHTML(S.deckSheet);
  if(S.newDeck)h+=newDeckHTML();
  if(S.preview)h+=previewHTML(S.preview);
  if(S.pendingLoad)h+=confirmLoadHTML();
  if(S.listText!=null)h+='<div class="overlay"><button class="scrim" data-act="closelist" aria-label="Close"></button><div class="sheet" role="dialog" aria-modal="true" aria-label="'+(S.listTitle||'Decklist')+'"><div class="grab"></div><div class="sheet-body"><h2 style="font-family:var(--display);font-size:22px">'+(S.listTitle||'Decklist')+'</h2><p class="sub" style="margin:0">'+(S.listTitle==='Backup'?'Saving files isn\u2019t available here. Select all, copy, and paste it into a note or a .json file to keep it.':'Select all and copy. This format pastes into Pokémon TCG Live.')+'</p><textarea class="field" rows="14" readonly style="font-size:14px">'+esc(S.listText)+'</textarea></div><div class="sheet-foot"><button class="btn" data-act="closelist">Done</button></div></div></div>';
  if(S.zoom){var c=CARD[S.zoom];h+='<div class="zoom" role="dialog" aria-modal="true" aria-label="'+esc(c.name)+' card image">'+cardFace(S.zoom,{w:'min(300px,74vw)',v:(copiesOf(S.zoom)[Math.min(S.card.sel,copiesOf(S.zoom).length-1)]||{}).variant,alt:'Your photo of '+c.name})+'<p style="color:#C9CCD3;font-size:13px;margin:0;text-align:center;max-width:280px">'+(photoOf(S.zoom)?'Your photo':'Illustration for the prototype. The official card image shows here in the real app.')+'</p>'+'<button data-act="closezoom">Close</button></div>';}
  el.innerHTML=h;
}

/* ---------- render ---------- */
function render(){
  var r=route();var html;
  if(r.name==='binder')html=binderHTML();
  else if(r.name==='card')html=cardHTML(r.id);
  else if(r.name==='add')html=addHTML();
  else if(r.name==='decks')html=decksHTML();
  else if(r.name==='deck')html=deckHTML(r.id);
  else if(r.name==='deckadd')html=deckAddHTML(r.id);
  else if(r.name==='sets')html=setsHTML();
  else if(r.name==='setdetail')html=setDetailHTML(r.id);
  var scr=document.getElementById('screen');
  var key=JSON.stringify(r)+S.stack.length,same=key===S.lastKey;S.lastKey=key;
  var oldScroll=same?scr.querySelector('.scroll'):null,keepY=oldScroll?oldScroll.scrollTop:0;
  scr.className=S.dir||'';S.dir='';
  scr.innerHTML=html;
  if(same){var ns=scr.querySelector('.scroll');if(ns)ns.scrollTop=keepY;}
  if(S.stagger&&!REDUCE&&!same){var sc=scr.querySelector('.scroll');if(sc){sc.classList.add('stagger');setTimeout(function(){sc.classList.remove('stagger');},700);}}
  S.stagger=false;
  document.getElementById('tabs').innerHTML=[['binder','Binder',I.tBinder],['add','Add card',I.tAdd],['decks','Decks',I.tDecks],['sets','Sets',I.tSets]].map(function(t){
    return '<button data-act="tab" data-v="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+(S.tabPop===t[0]?' class="justnow"':'')+'>'+t[2]+t[1]+'</button>';}).join('');S.tabPop=null;
  renderLayer();renderToast();
}
function refreshBinderParts(){
  var res=document.getElementById('bres');if(res)res.innerHTML=binderResultsHTML();
  var ch=document.getElementById('bchips');if(ch){var qc=quickChips();ch.innerHTML=qc;ch.hidden=!qc;}
}

/* ---------- events ---------- */
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='bq'){S.b.query=t.value;refreshBinderParts();}
  else if(t.id==='dq'){S.da.query=t.value;document.getElementById('dares').innerHTML=deckAddResults(route().id);}
  else if(t.id==='ndn'){S.nd=S.nd||{name:'',format:'Standard'};S.nd.name=t.value;}
  else if(t.id==='aq'){S.add.query=t.value;S.add.limit=30;document.getElementById('ares').innerHTML=addResults();}
  else if(t.dataset&&t.dataset.f&&route().name==='card'){
    editCopy(route().id,(function(){var p={};p[t.dataset.f]=t.value;return p;})());
    var s=document.querySelector('.saved');if(s)s.innerHTML=I.check+'Saved';
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='load-in'){
    var lf=e.target.files&&e.target.files[0];e.target.value='';if(!lf)return;
    var rd=new FileReader();
    rd.onload=function(){var b=null;try{b=JSON.parse(rd.result);}catch(x){b=null;}
      if(!validBackup(b)){showToast({text:'That file isn\u2019t a My Binder backup',sub:'Choose a .json file saved from this app'});return;}
      S.pendingLoad=b;renderLayer();};
    rd.onerror=function(){showToast({text:'Couldn\u2019t read that file',sub:'Try saving it again, then load it'});};
    rd.readAsText(lf);return;
  }
  if(e.target.id==='photo-in'){
    var file=e.target.files&&e.target.files[0];var pid=e.target.dataset.id;if(!file)return;
    var img=new Image();var url=URL.createObjectURL(file);
    img.onload=function(){
      var max=900,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
      var prev=photos[pid];photos[pid]=cv.toDataURL('image/jpeg',0.8);
      if(savePhotos()){showToast({text:'Photo added to '+CARD[pid].name});}
      else{if(prev)photos[pid]=prev;else delete photos[pid];showToast({text:'Couldn\u2019t save the photo',sub:'This browser is out of space for the prototype'});}
      render();
    };
    img.onerror=function(){URL.revokeObjectURL(url);showToast({text:'That file isn\u2019t a photo this browser can open',sub:'Try a JPG or PNG'});};
    img.src=url;return;
  }
  if(e.target.dataset&&e.target.dataset.f&&route().name==='card')render();
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,v=el.dataset.v,id=el.dataset.id,r=route();
  switch(a){
    case 'tab':hideToast();S.preview=null;S.deckSheet=null;S.newDeck=false;if(v==='add')S.add={query:'',session:{}};tab(v);break;
    case 'back':back();break;
    case 'card':var vi=0;if(el.dataset.var){copiesOf(id).some(function(x,i){if(x.variant===el.dataset.var){vi=i;return true;}});}openCard(id,vi);break;
    case 'sheet':S.sheet=true;renderLayer();break;
    case 'closesheet':animateClose(function(){S.sheet=false;renderLayer();});break;
    case 'toggle':var k=el.dataset.g+':'+v;S.b.picked[k]=!S.b.picked[k];
      if(S.sheet){var keep=document.querySelector('.sheet-body');var y=keep?keep.scrollTop:0;render();var nb=document.querySelector('.sheet-body');if(nb)nb.scrollTop=y;}else render();break;
    case 'setorder':S.b.setOrder=v;if(S.sheet){var so=document.querySelector('.sheet-body');var soy=so?so.scrollTop:0;render();var so2=document.querySelector('.sheet-body');if(so2)so2.scrollTop=soy;}else refreshBinderParts();break;
    case 'sort':S.b.sort=v;var sb=document.querySelector('.sheet-body');var sy=sb?sb.scrollTop:0;render();var nsb=document.querySelector('.sheet-body');if(nsb)nsb.scrollTop=sy;break;
    case 'reset':S.b.picked={};S.b.sort='Set number';render();break;
    case 'clear':S.b.picked={};S.b.query='';render();break;
    case 'view':S.b.view=v;refreshBinderParts();break;
    case 'fold':(function(k,btn){var closing=!folded[k];var after=function(){folded[k]=closing;saveFolded();var bs=document.getElementById('bres');var fy=bs?bs.scrollTop:0;refreshBinderParts();var bs2=document.getElementById('bres');if(bs2)bs2.scrollTop=fy;
        if(!closing){var h=document.querySelector('.sghead[data-v="'+k+'"]');markOpening([h&&h.nextElementSibling]);}};
      if(closing)animateOut([btn.nextElementSibling],after);else after();})(v,el);break;
    case 'group':S.b.group=S.b.group==='Regulation mark'?'Set':'Regulation mark';refreshBinderParts();var hd=document.querySelector('[data-act="group"]');if(hd)render();break;
    case 'groupset':S.b.group=v;var gb=document.querySelector('.sheet-body');var gy=gb?gb.scrollTop:0;render();var gb2=document.querySelector('.sheet-body');if(gb2)gb2.scrollTop=gy;break;
    case 'foldreg':(function(k,btn){var closing=!folded[k];var stop=function(x){return !x||x.classList.contains('regsep')||x.tagName==='H2'||x.classList.contains('backup')||x.classList.contains('btn-ghost');};var sib=[],n=btn.nextElementSibling;while(!stop(n)){sib.push(n);n=n.nextElementSibling;}
      var after=function(){folded[k]=closing;saveFolded();if(route().name==='binder'){var rb=document.getElementById('bres');var ry=rb?rb.scrollTop:0;refreshBinderParts();var rb2=document.getElementById('bres');if(rb2)rb2.scrollTop=ry;}else{render();}
        if(!closing){var h=document.querySelector('.regsep[data-v="'+k+'"]');var out=[],m=h&&h.nextElementSibling;while(!stop(m)){out.push(m);m=m.nextElementSibling;}markOpening(out);}};
      if(closing)animateOut(sib,after);else after();})(v,el);break;
    case 'foldall':var ks={};ownedIds().forEach(function(id){ks[S.b.group==='Regulation mark'?'reg:'+(CARD[id].reg||'-'):CARD[id].set]=1;});var op=Object.keys(ks).some(function(k){return !folded[k];});Object.keys(ks).forEach(function(k){folded[k]=op;if(SET[k]&&SET[k].reg)folded['regsep:'+SET[k].reg]=false;});saveFolded();refreshBinderParts();break;
    case 'zoom':S.zoom=id;renderLayer();break;
    case 'rmphoto':var old=photos[id];delete photos[id];savePhotos();render();showToast({text:'Photo removed',undo:function(){photos[id]=old;savePhotos();}});break;
    case 'closezoom':animateClose(function(){S.zoom=null;renderLayer();});break;
    case 'selcopy':S.card.sel=+el.dataset.i;render();break;
    case 'addcopy':var cps=copiesOf(r.id);cps.push({variant:defaultVariant(r.id),qty:1,trade:false,where:'',notes:'',added:tick()});persist();S.card.sel=cps.length-1;S.card.saved=true;render();break;
    case 'setf':var p={};p[el.dataset.f]=v;editCopy(r.id,p);render();break;
    case 'qty':var cs=copiesOf(r.id);var cur=cs[Math.min(S.card.sel,cs.length-1)];editCopy(r.id,{qty:Math.max(1,cur.qty+(+v))});render();pop('.stepval');break;
    case 'trade':var cs2=copiesOf(r.id);editCopy(r.id,{trade:!cs2[Math.min(S.card.sel,cs2.length-1)].trade});render();break;
    case 'rmcopy':
      var snap=snapshot();var cid=r.id;var list=copiesOf(cid);var sel=Math.min(S.card.sel,list.length-1);var gone=list[sel];var c=CARD[cid];
      if(list.length>1){list.splice(sel,1);persist();S.card.sel=0;render();
        showToast({text:'Removed '+gone.variant+' copy',undo:function(){restore(snap);S.card.sel=sel;}});}
      else{delete inv[cid];persist();back();
        showToast({text:'Removed '+c.name+' from your binder',undo:function(){restore(snap);}});}
      break;
    case 'undo':var t=S.toast;if(t&&t.undo){t.undo();}hideToast();render();break;
    case 'toastedit':var te=S.toast&&S.toast.edit;hideToast();if(te){var l=copiesOf(te);var idx=0;var dv2=defaultVariant(te);l.forEach(function(x,i){if(x.variant===dv2)idx=i;});openCard(te,idx);}break;
    case 'addplus':addOne(id);render();pop('.counter:has([data-id="'+id+'"]) span');break;
    case 'addminus':removeOne(id);render();pop('.counter:has([data-id="'+id+'"]) span');break;
    case 'try':S.add.query=v;render();break;
    case 'openset':S.set.mode='All';S.set.scope='Everything';go({name:'setdetail',id:v});break;
    case 'setmode':S.set.mode=v;render();break;
    case 'opendeck':S.deckSheet=null;go({name:'deck',id:v});break;
    case 'deckadd':S.da={query:''};go({name:'deckadd',id:v});break;
    case 'dq':setDeckQty(r.id,id,+v);if(r.name==='deckadd'){var sy2=document.getElementById('dares').scrollTop;document.getElementById('dares').innerHTML=deckAddResults(r.id);document.getElementById('dares').scrollTop=sy2;var dn=document.querySelector('.done');if(dn)dn.textContent='Done, '+deckSize(deckById(r.id))+' / 60';}else{var sc=document.querySelector('.scroll');var y3=sc?sc.scrollTop:0;render();var sc2=document.querySelector('.scroll');if(sc2)sc2.scrollTop=y3;}break;
    case 'decksheet':S.deckSheet=id;renderLayer();break;
    case 'closedecksheet':animateClose(function(){S.deckSheet=null;render();});break;
    case 'dqs':setDeckQty(el.dataset.d,id,+v);renderLayer();break;
    case 'newdeck':S.nd={name:'',format:'Standard'};S.newDeck=true;renderLayer();var f=document.getElementById('ndn');if(f)f.focus();break;
    case 'closenewdeck':animateClose(function(){S.newDeck=false;renderLayer();});break;
    case 'ndformat':S.nd.format=v;renderLayer();break;
    case 'createdeck':var nm=(S.nd&&S.nd.name||'').trim();if(!nm){var f2=document.getElementById('ndn');if(f2){f2.focus();f2.style.borderColor='var(--danger)';f2.placeholder='Give your deck a name';}break;}
      var nd={id:'d'+tick(),name:nm,format:S.nd.format,cards:{}};decks.push(nd);saveDecks();S.newDeck=false;
      if(S.deckSheet){renderLayer();}else{go({name:'deck',id:nd.id});}showToast({text:'Created '+nm});break;
    case 'deldeck':var dsnap=JSON.stringify(decks);var dd=deckById(v);decks=decks.filter(function(x){return x.id!==v;});saveDecks();back();showToast({text:'Deleted '+dd.name,undo:function(){decks=JSON.parse(dsnap);saveDecks();}});break;
    case 'copylist':var txt=decklistText(deckById(v));
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){showToast({text:'Decklist copied',sub:'Paste it into Pokémon TCG Live or a notes app'});},function(){S.listText=txt;renderLayer();});}else{S.listText=txt;renderLayer();}break;
    case 'closelist':animateClose(function(){S.listText=null;S.listTitle=null;renderLayer();});break;
    case 'setscope':S.set.scope=v;render();break;
    case 'preview':S.preview=id;renderLayer();break;
    case 'closepreview':animateClose(function(){S.preview=null;renderLayer();});break;
    case 'setview':S.set.view=v;render();break;
    case 'pv-open':S.preview=null;openCard(id,0);break;
    case 'pv-add':var pc=CARD[id];addOne(id);S.preview=null;var psc=document.querySelector('.scroll');var py=psc?psc.scrollTop:0;render();var psc2=document.querySelector('.scroll');if(psc2)psc2.scrollTop=py;break;
    case 'addmore':S.add.limit=(S.add.limit||30)+30;var ar=document.getElementById('ares');var ay=ar.scrollTop;ar.innerHTML=addResults();ar.scrollTop=ay;break;
    case 'findmissing':S.preview=null;S.tab='add';S.add={query:v,session:{}};S.stack=[{name:'add'}];S.dir='enter';render();break;
    case 'export':saveBackup();break;
    case 'cancelload':animateClose(function(){S.pendingLoad=null;renderLayer();});break;
    case 'doload':var b=S.pendingLoad;var snapI=JSON.stringify(inv),snapD=JSON.stringify(decks),snapP=JSON.stringify(photos),snapF=JSON.stringify(folded);
      inv=b.cards;decks=b.decks;photos=b.photos||{};folded=b.folded||{};persist();saveDecks();savePhotos();saveFolded();S.pendingLoad=null;
      S.b={query:'',picked:{},sort:'Set number',view:S.b.view};render();
      showToast({text:'Backup loaded',sub:summarize(b),undo:function(){inv=JSON.parse(snapI);decks=JSON.parse(snapD);photos=JSON.parse(snapP);folded=JSON.parse(snapF);persist();saveDecks();savePhotos();saveFolded();}});break;
    case 'resetdemo':inv=seed();persist();decks=seedDecks();saveDecks();S.b={query:'',picked:{},sort:'Set number',view:'grid'};showToast({text:'Prototype reset to the sample cards'});render();break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(S.pendingLoad){S.pendingLoad=null;renderLayer();return;}if(S.preview){S.preview=null;renderLayer();return;}if(S.newDeck){S.newDeck=false;renderLayer();return;}if(S.deckSheet){S.deckSheet=null;render();return;}if(S.listText!=null){S.listText=null;renderLayer();return;}if(S.zoom){S.zoom=null;renderLayer();}else if(S.sheet){S.sheet=false;renderLayer();}}
});

/* mouse drag-to-scroll for PC (wheel and trackpad already work) */
(function(){
  var st=null,suppress=false;
  document.addEventListener('pointerdown',function(e){
    if(e.pointerType!=='mouse'||e.button!==0)return;
    if(e.target.closest('input,textarea,select,label'))return;
    var el=e.target.closest('.scroll,.sheet-body,.chips,.tbar');if(!el)return;
    st={el:el,x:e.clientX,y:e.clientY,top:el.scrollTop,left:el.scrollLeft,moved:false};
  });
  document.addEventListener('pointermove',function(e){
    if(!st)return;var dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.moved&&Math.abs(dx)<6&&Math.abs(dy)<6)return;
    if(!st.moved){st.moved=true;document.body.classList.add('dragging');}
    st.el.scrollTop=st.top-dy;st.el.scrollLeft=st.left-dx;e.preventDefault();
  });
  function end(){if(!st)return;if(st.moved){suppress=true;setTimeout(function(){suppress=false;},0);}document.body.classList.remove('dragging');st=null;}
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
  document.addEventListener('click',function(e){if(suppress){e.stopPropagation();e.preventDefault();suppress=false;}},true);
  document.addEventListener('dragstart',function(e){if(e.target.closest('.scroll'))e.preventDefault();});
})();
render();
})();
</script>
